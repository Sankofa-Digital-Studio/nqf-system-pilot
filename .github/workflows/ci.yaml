name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retain-build:
        description: Upload the Vinext build and verify it in a separate job
        type: boolean
        default: false
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  quality:
    name: Lint, type-check and build
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm exec -- tsc --noEmit --incremental false
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Package build output
        if: github.event_name == 'workflow_dispatch' && inputs.retain-build
        run: tar -czf vinext-build.tar.gz dist
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch' && inputs.retain-build
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          path: vinext-build.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  verify-artifact:
    name: Verify build artifact
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.retain-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Verify archive contains the build
        run: |
          tar -tzf artifact/vinext-build.tar.gz > artifact/contents.txt
          grep -Eq '^dist/.+[^/]$' artifact/contents.txt

  issue-labels:
    name: Label pilot issues
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          configuration-path: .github/issue-labels.yml
          enable-versioned-regex: '0'
          include-title: '1'
          include-body: '0'
          sync-labels: '0'

  project-intake:
    name: Add new issues to GitHub Projects
    if: github.event_name == 'issues' && github.event.action == 'opened' && vars.NQF_PROJECT_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add to GitHub Projects
        env:
          NQF_PROJECT_TOKEN: ${{ secrets.NQF_PROJECT_TOKEN }}
        if: env.NQF_PROJECT_TOKEN != ''
        uses: actions/add-to-project@v2.0.1
        with:
          project-url: ${{ vars.NQF_PROJECT_URL }}
          github-token: ${{ env.NQF_PROJECT_TOKEN }}

  greeting:
    name: Welcome first-time contributors
    if: (github.event_name == 'issues' || github.event_name == 'pull_request_target') && github.event.action == 'opened' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      # This job handles metadata only. It never checks out pull-request code.
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ github.token }}
          issue-message: "Thanks for opening your first Bridge5 issue. For bugs, please include the module, steps to reproduce, and what you expected to happen."
          pr-message: "Thanks for your first Bridge5 pull request. Please describe what changed and how you verified it."
