name: Vercel preview smoke

on:
  deployment_status:

permissions: {}

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      github.event.deployment.production_environment == false &&
      startsWith(github.event.deployment_status.environment_url, 'https://nqf-system-pilot-') &&
      endsWith(github.event.deployment_status.environment_url, '-ohhttooexcivs-projects.vercel.app')
    uses: Sankofa-Digital-Studio/sankofa-visual-template-library/.github/workflows/reusable-hosted-smoke.yml@dcceedd6a0c3fe49b014f64c82a565dfce2e5c77
    with:
      base-url: ${{ github.event.deployment_status.environment_url }}
      json-health-path: /api/pilot
      allowed-host-suffix: '-ohhttooexcivs-projects.vercel.app'
